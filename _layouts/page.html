---
layout: default
---
<div class="container">
  {% include breadcrumbs.html %}

  <header class="page-head">
    {%- if page.eyebrow -%}<p class="page-head__eyebrow">{{ page.eyebrow }}</p>{%- endif -%}
    <h1>{{ page.titulo | default: page.title }}</h1>
    {%- if page.resumo -%}<p class="page-head__lead">{{ page.resumo }}</p>{%- endif -%}
  </header>

  <div class="prose">
    {{ content }}
  </div>
</div>
