# Cronograma da Oferta viva. UMA LINHA POR ENCONTRO.
#
# A data é escrita à mão, nunca calculada. O semestre não é grade regular —
# feriado e ajuste de calendário fazem a aritmética errar em silêncio, e uma
# lista explícita erra de forma visível, na revisão deste arquivo.
# Ver docs/adr/0002-material-ancorado-em-semana-nao-em-data.md
#
# `encontro` é o nome do arquivo em _encontros/ sem a extensão.
#
# ---------------------------------------------------------------------------
# PENDENTE (D5) — DATAS PROVISÓRIAS.
# Grade de terças a partir de 2026-08-11, com segundo Encontro às quintas nas
# Semanas 13 a 16. NÃO foi conferida contra o calendário acadêmico oficial de
# 2026/2 nem contra feriados do período.
# Conferir com a coordenação ANTES de compartilhar o site com a turma.
#
# PENDENTE (D4) — CARGA HORÁRIA.
# São 20 Encontros de 2h = 40h, contra as 60h declaradas pelos 4 créditos.
# A diferença de 20h é o tempo de trabalho de Squad no Projeto Integrado, que
# não é Encontro. Conferir com a coordenação como as 60h se compõem.
# ---------------------------------------------------------------------------

