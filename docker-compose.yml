services:
  site:
    build:
      context: .
      args:
        RUBY_VERSION: ${RUBY_VERSION:-3.3}
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/srv/jekyll:cached
      - bundle:/usr/local/bundle
      - jekyll_cache:/srv/jekyll/.jekyll-cache
    environment:
      JEKYLL_ENV: development

volumes:
  bundle:
  jekyll_cache:
